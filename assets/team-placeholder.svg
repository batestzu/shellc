<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600">
  <!-- Vertical S.H.E. acronym, styled after the S.H.E. Handy poster.
       Temporary stand-in for the About page team photo. -->
  <rect width="900" height="1600" fill="#F2ECE1"/>

  <!-- thin inset frame -->
  <rect x="44" y="44" width="812" height="1512" rx="10" fill="none" stroke="#5B6236" stroke-width="3" opacity="0.55"/>

  <!-- house roofline -->
  <g fill="none" stroke="#5B6236" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 250 L450 140 L600 250"/>
    <path d="M545 210 V160 H575 V232"/>
  </g>
  <g fill="#B5604C">
    <rect x="433" y="196" width="15" height="15"/><rect x="452" y="196" width="15" height="15"/>
    <rect x="433" y="215" width="15" height="15"/><rect x="452" y="215" width="15" height="15"/>
  </g>

  <g text-anchor="middle">
    <text x="450" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="300" font-weight="700" fill="#2B2620">S</text>
    <circle cx="450" cy="595" r="13" fill="#B5604C"/>
    <text x="450" y="665" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="10" fill="#5B6236">SKILLED</text>
    <text x="450" y="960" font-family="Georgia, 'Times New Roman', serif" font-size="300" font-weight="700" fill="#2B2620">H</text>
    <circle cx="450" cy="1015" r="13" fill="#B5604C"/>
    <text x="450" y="1085" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="10" fill="#5B6236">HOME</text>
    <text x="450" y="1380" font-family="Georgia, 'Times New Roman', serif" font-size="300" font-weight="700" fill="#2B2620">E</text>
    <circle cx="450" cy="1435" r="13" fill="#B5604C"/>
    <text x="450" y="1505" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="10" fill="#5B6236">EXPERTS</text>
  </g>
</svg>
